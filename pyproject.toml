[project]
name = "credit-default-mlops-pipeline"
version = "0.2.0"
description = "Credit Default Scoring — Pipeline MLOps production-ready (FastAPI + MLflow + Prometheus + Grafana)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "mlflow>=2.10",
  "prometheus-fastapi-instrumentator>=7.0",
  "scikit-learn>=1.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.9",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests nécessitant la stack Docker (MLflow/MinIO/API)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
  "ignore::FutureWarning",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/conftest.py", "*.save"]

[tool.coverage.report]
show_missing = true
skip_covered = false
