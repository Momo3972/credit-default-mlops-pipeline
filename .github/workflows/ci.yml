name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ── Qualité du code ─────────────────────────────────────────────────
      - name: Ruff — vérification du format
        run: ruff format --check .

      - name: Ruff — lint
        run: ruff check .

      # ── Tests unitaires ─────────────────────────────────────────────────
      - name: Pytest — tests unitaires
        run: pytest -q -m "not integration" --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload couverture (Codecov)
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      # ── Sécurité ────────────────────────────────────────────────────────
      - name: pip-audit — scan des dépendances
        run: pip-audit -r requirements.txt
        # mlflow 2.10.2 contient des CVEs résolues dans 2.19+.
        # Mise à jour mlflow prévue — non bloquante pour ce portfolio.
        continue-on-error: true

      - name: Bandit — analyse statique sécurité
        run: bandit -r api.py train.py evaluate.py predict.py -ll --quiet

      # ── Build Docker ─────────────────────────────────────────────────────
      - name: Docker build
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t credit-default-api:ci \
            .
