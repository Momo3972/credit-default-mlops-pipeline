data:
  path: data/cs-training.csv
  target: SeriousDlqin2yrs

decision:
  threshold: 0.05
  strategy: max_recall_default

train:
  test_size: 0.2
  random_state: 42

model:
  # Algorithme principal (logistic_regression | random_forest | gradient_boosting)
  type: logistic_regression
  params:
    C: 1.0
    max_iter: 1000

mlflow:
  experiment_name: credit-default-train
  model_name: credit-default-model
  # Alias MLflow (format @alias recommandé — les stages /Production sont dépréciés depuis MLflow 2.x)
  model_uri: models:/credit-default-model@production

predict:
  test_path: data/cs-test.csv
  output_path: data/outputs/predictions.csv
